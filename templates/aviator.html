<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOM AVIATOR - Red Jet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #07090e;
            color: #fff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            max-width: 450px;
            background: rgba(18, 24, 38, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3447;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .lobby-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .lobby-btn:hover {
            background: #334155;
            border-color: #475569;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .user-info {
            font-size: 13px;
            color: #94a3b8;
        }

        .balance-badge {
            background: #1e293b;
            border: 1px solid #f59e0b;
            padding: 4px 10px;
            border-radius: 20px;
            color: #f59e0b;
            font-weight: bold;
            font-size: 14px;
            margin-left: 6px;
        }

        /* Game Screen */
        .game-container {
            width: 100%;
            max-width: 380px;
            height: 280px;
            margin: 15px auto;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #2a3447;
            background: #0b0f19;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(239, 68, 68, 0.15);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #graphCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #redPlane {
            position: absolute;
            font-size: 32px;
            z-index: 3;
            transition: transform 0.1s linear;
            filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.8));
            display: none;
        }

        .multiplier-display {
            font-size: 44px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            z-index: 4;
            position: relative;
        }

        .game-status-text {
            font-size: 13px;
            color: #ef4444;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 4;
            position: relative;
            font-weight: bold;
        }

        /* Controls */
        .controls-panel {
            width: 100%;
            max-width: 380px;
            background: #121826;
            border: 1px solid #2a3447;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .bet-input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #07090e;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 8px 12px;
        }

        .bet-input-row label {
            font-size: 12px;
            color: #64748b;
            font-weight: bold;
        }

        .bet-input-row input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 100px;
            text-align: right;
            outline: none;
        }

        .quick-bets {
            display: flex;
            gap: 6px;
            justify-content: space-between;
        }

        .q-btn {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .q-btn:hover {
            background: #ef4444;
            color: #fff;
            border-color: #f87171;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-bet-fly {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: white;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .btn-cashout {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            display: none;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #121826;
            padding: 12px 20px;
            border-radius: 14px;
            border: 2px solid #ef4444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            width: 280px;
            text-align: center;
        }

        .toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-title {
            font-size: 15px;
            font-weight: 900;
            color: #ef4444;
            text-transform: uppercase;
        }

        .toast-desc {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/" class="lobby-btn">🏠 Lobby</a>
        <div class="brand-name">🚀 OOM AVIATOR</div>
        <div class="user-info">
            <span id="userDisp">Player</span>
            <span class="balance-badge">₹<span id="balDisp">0.00</span></span>
        </div>
    </div>

    <div class="game-container">
        <canvas id="graphCanvas"></canvas>
        <div id="redPlane">✈️</div>
        <div class="multiplier-display" id="multiplierDisp">1.00x</div>
        <div class="game-status-text" id="statusText">Waiting for players...</div>
    </div>

    <div class="controls-panel">
        <div class="bet-input-row">
            <label>BET AMOUNT (₹)</label>
            <input type="number" id="betAmount" value="100" min="100">
        </div>

        <div class="quick-bets">
            <button class="q-btn" onclick="setAmt(100)">100</button>
            <button class="q-btn" onclick="setAmt(500)">500</button>
            <button class="q-btn" onclick="setAmt(1000)">1000</button>
            <button class="q-btn" onclick="setAmt(2000)">2000</button>
        </div>

        <button class="action-btn btn-bet-fly" id="betBtn" onclick="placeAviatorBet()">PLACE BET</button>
        <button class="action-btn btn-cashout" id="cashoutBtn" onclick="cashOut()">CASH OUT</button>
    </div>

    <div class="toast-container" id="toastBox">
        <div class="toast-title" id="toastTitle">AVIATOR</div>
        <div class="toast-desc" id="toastDesc">Status message</div>
    </div>

    <script>
        let currentBalance = 0;
        let gameState = 'waiting'; 
        let currentMultiplier = 1.00;
        let crashPoint = 1.40;
        let activeBet = 0;
        let gameInterval = null;
        let hasCashedOut = false;

        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const plane = document.getElementById('redPlane');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 🔄 Function to update and sync balance across UI, LocalStorage, and other tabs
        function updateBalance(newBal) {
            currentBalance = parseFloat(newBal);
            document.getElementById('balDisp').innerText = currentBalance.toFixed(2);
            localStorage.setItem('wallet_balance', currentBalance);
            
            // Aapka add kiya gaya wallet UI aur server sync function
            updateWalletUI();
        }

        // Aapka naya add kiya gaya function
        function updateWalletUI() {
            const walletDisplayEl = document.getElementById('walletDisplay');
            if (walletDisplayEl) {
                walletDisplayEl.innerText = `₹ ${currentBalance.toFixed(2)}`;
            }
            localStorage.setItem('userBalance', currentBalance.toString());
            
            // Naya balance server par bhejne ke liye yeh function call karein
            updateServerBalance(currentBalance);
        }

        // Server par balance sync karne ke liye function
        async function updateServerBalance(newBalance) {
            try {
                await fetch('/api/update-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ balance: newBalance })
                });
            } catch (err) {
                console.error("Failed to sync balance to server:", err);
            }
        }

        // 🔄 Listen for balance updates from other tabs/games
        window.addEventListener('storage', (event) => {
            if (event.key === 'wallet_balance') {
                let syncedBal = parseFloat(event.newValue);
                if (!isNaN(syncedBal) && syncedBal !== currentBalance) {
                    currentBalance = syncedBal;
                    document.getElementById('balDisp').innerText = currentBalance.toFixed(2);
                }
            }
        });

        // 🔄 Background periodic server polling to keep balance synced
        function syncServerBalance() {
            fetch('/get_game_state')
                .then(res => res.json())
                .then(data => {
                    if (data.balance !== undefined) {
                        let serverBal = parseFloat(data.balance);
                        if (serverBal !== currentBalance) {
                            updateBalance(serverBal);
                        }
                    }
                }).catch(() => {});
        }
        setInterval(syncServerBalance, 3000); // Poll every 3 seconds

        window.addEventListener('DOMContentLoaded', () => {
            fetch('/get_game_state')
                .then(res => res.json())
                .then(data => {
                    if (data.balance !== undefined) {
                        updateBalance(data.balance);
                        
                        let savedBet = localStorage.getItem('oom_active_bet');
                        if (savedBet) {
                            activeBet = parseFloat(savedBet);
                            document.getElementById('betBtn').style.display = 'none';
                            document.getElementById('cashoutBtn').style.display = 'block';
                            showToast(`Restored active bet of ₹${activeBet}`, "RESTORED");
                        }
                    }
                });
            startWaitingPhase();
        });

        function setAmt(val) {
            document.getElementById('betAmount').value = val;
        }

        function startWaitingPhase() {
            gameState = 'waiting';
            hasCashedOut = false;
            currentMultiplier = 1.00;
            plane.style.display = 'none';
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            document.getElementById('multiplierDisp').innerText = '1.00x';
            document.getElementById('multiplierDisp').style.color = '#fff';
            
            let count = 10; 
            document.getElementById('statusText').innerText = `Next flight in ${count}s`;

            let countdown = setInterval(() => {
                count--;
                if(count > 0) {
                    document.getElementById('statusText').innerText = `Next flight in ${count}s`;
                } else {
                    clearInterval(countdown);
                    startFlight();
                }
            }, 1000);
        }

        function placeAviatorBet() {
            if (gameState !== 'waiting') {
                showToast("Flight already started! Wait for next round.");
                return;
            }

            let amt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(amt) || amt < 100) {
                showToast("Minimum bet is ₹100!");
                return;
            }

            if (amt > currentBalance) {
                showToast("Insufficient Balance!");
                return;
            }

            fetch('/place_bet', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({color: 'aviator', amount: amt})
            }).then(res => res.json()).then(data => {
                if (data.status === 'success') {
                    activeBet = amt;
                    updateBalance(data.new_balance);
                    
                    localStorage.setItem('oom_active_bet', activeBet);
                    showToast(`Bet of ₹${amt} locked successfully!`);
                    
                    document.getElementById('betBtn').style.display = 'none';
                    document.getElementById('cashoutBtn').style.display = 'block';
                } else {
                    showToast(data.message || "Bet error");
                }
            });
        }

        function startFlight() {
            gameState = 'flying';
            document.getElementById('statusText').innerText = "FLYING...";
            plane.style.display = 'block';
            
            fetch('/api/aviator/crash_point')
                .then(res => res.json())
                .then(data => {
                    if(data.crash_point) {
                        crashPoint = data.crash_point;
                    }
                })
                .catch(() => {
                    crashPoint = 1.40; 
                });

            currentMultiplier = 1.00;
            let startTime = Date.now();

            gameInterval = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                currentMultiplier = parseFloat((1.00 + elapsed * 0.18).toFixed(2));
                document.getElementById('multiplierDisp').innerText = currentMultiplier.toFixed(2) + 'x';

                let width = canvas.width;
                let height = canvas.height;
                let progressX = Math.min(width - 40, 30 + elapsed * 25);
                let progressY = Math.min(height - 30, height - (currentMultiplier * 18));

                ctx.clearRect(0, 0, width, height);
                
                ctx.beginPath();
                ctx.moveTo(30, height);
                ctx.lineTo(progressX, progressY);
                ctx.lineTo(progressX, height);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(30, height);
                ctx.lineTo(progressX, progressY);
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
                ctx.stroke();

                plane.style.left = (progressX - 10) + 'px';
                plane.style.bottom = (height - progressY - 10) + 'px';

                if (currentMultiplier >= crashPoint) {
                    clearInterval(gameInterval);
                    crashFlight();
                }
            }, 50);
        }

        function cashOut() {
            if (gameState !== 'flying' || activeBet <= 0 || hasCashedOut) return;

            hasCashedOut = true;
            let winnings = activeBet * currentMultiplier;
            
            fetch('/api/aviator/cashout', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ winnings: winnings })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    updateBalance(data.balance);
                }
            });
            
            localStorage.removeItem('oom_active_bet');
            showToast(`🎉 Cashed out at ${currentMultiplier.toFixed(2)}x! Won ₹${winnings.toFixed(2)}`, "SUCCESS");

            document.getElementById('cashoutBtn').style.display = 'none';
            document.getElementById('betBtn').style.display = 'block';
            activeBet = 0;
        }

        function crashFlight() {
            gameState = 'crashed';
            document.getElementById('multiplierDisp').innerText = crashPoint.toFixed(2) + 'x';
            document.getElementById('multiplierDisp').style.color = '#ef4444';
            document.getElementById('statusText').innerText = "FLEW AWAY!";
            plane.style.display = 'none';

            if (activeBet > 0 && !hasCashedOut) {
                showToast(`💥 Plane crashed at ${crashPoint.toFixed(2)}x! Lost ₹${activeBet}`, "CRASHED", true);
                
                fetch('/api/aviator/crash', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                }).then(res => res.json()).then(data => {
                    if (data.balance !== undefined) {
                        updateBalance(data.balance);
                    }
                }).catch(() => {});
            }

            localStorage.removeItem('oom_active_bet');
            activeBet = 0;
            hasCashedOut = false;

            document.getElementById('cashoutBtn').style.display = 'none';
            document.getElementById('betBtn').style.display = 'block';

            setTimeout(startWaitingPhase, 3000); 
        }

        function showToast(desc, title = "AVIATOR", isLoss = false) {
            const box = document.getElementById('toastBox');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastDesc').innerText = desc;
            box.classList.add('show');
            setTimeout(() => box.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
