<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Parity Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #050b14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Bar */
        .navbar {
            width: 100%;
            max-width: 480px;
            background: rgba(10, 15, 28, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f59e0b, #d4af37, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .wallet-display {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Game Header Info */
        .game-header {
            background: #0d1526;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .period-box div:first-child, .timer-box div:first-child {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 800;
            text-transform: uppercase;
        }

        .period-box div:last-child {
            font-size: 14px;
            font-weight: 900;
            color: #f8fafc;
        }

        .timer-box {
            text-align: right;
        }

        .timer-box div:last-child {
            font-size: 18px;
            font-weight: 900;
            color: #34d399;
        }

        /* Result Animation Box */
        .result-banner {
            display: none;
            background: rgba(13, 21, 38, 0.98);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-banner h3 { font-size: 13px; color: #fbbf24; margin-bottom: 2px; }
        .result-banner p { font-size: 12px; font-weight: bold; }
        .profit-text { color: #34d399; }
        .loss-text { color: #f87171; }

        /* Betting Card */
        .betting-card {
            background: #0d1526;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .color-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .parity-btn {
            padding: 12px 8px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid #334155;
            color: white;
            text-align: center;
            transition: 0.2s;
        }

        .btn-green { background: #065f46; border-color: #10b981; }
        .btn-violet { background: #6b21a8; border-color: #a855f7; }
        .btn-red { background: #991b1b; border-color: #ef4444; }

        .parity-btn:hover {
            filter: brightness(1.15);
            border-color: #d4af37;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .num-parity-btn {
            background: #0b1120;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .num-parity-btn:hover {
            border-color: #d4af37;
        }

        /* Chip Selector */
        .chip-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .chip {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            background: #0f172a;
            color: #fff;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .chip.active {
            border-color: #d4af37;
            background: linear-gradient(135deg, #b45309, #d97706);
            transform: scale(1.1);
        }

        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #080e1a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 8px 12px;
        }

        .input-label {
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 900;
            width: 90px;
            text-align: right;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <a href="/" class="back-btn">⬅ LOBBY</a>
        <div class="brand-name">⚓ PARITY ARENA</div>
        <div class="wallet-display" id="walletDisplay">₹ 0.00</div>
    </div>

    <div class="container">
        
        <!-- GAME HEADER -->
        <div class="game-header">
            <div class="period-box">
                <div>Period</div>
                <div id="periodNumber">2026090101</div>
            </div>
            <div class="timer-box">
                <div>Time Remaining</div>
                <div id="timerDisplay">30s</div>
            </div>
        </div>

        <!-- RESULT BANNER -->
        <div class="result-banner" id="resultBanner">
            <h3 id="resultTitle">RESULT: 5 (GREEN)</h3>
            <p id="resultDesc">Won: <span class="profit-text">+₹200.00</span></p>
        </div>

        <!-- BETTING CARD -->
        <div class="betting-card">
            <div style="font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase;">1. Select Color Bet</div>
            <div class="color-buttons">
                <button class="parity-btn btn-green" onclick="placeBet('green')">GREEN (2x)</button>
                <button class="parity-btn btn-violet" onclick="placeBet('violet')">VIOLET (4.5x)</button>
                <button class="parity-btn btn-red" onclick="placeBet('red')">RED (2x)</button>
            </div>

            <div style="font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-top: 4px;">2. Select Number Bet (9x Payout)</div>
            <div class="number-grid" id="numberGrid"></div>

            <div class="chip-selector">
                <div class="chip active" onclick="selectChip(10, this)">₹10</div>
                <div class="chip" onclick="selectChip(50, this)">₹50</div>
                <div class="chip" onclick="selectChip(100, this)">₹100</div>
                <div class="chip" onclick="selectChip(500, this)">₹500</div>
            </div>

            <div class="input-row">
                <span class="input-label">Current Bet (₹)</span>
                <input type="number" id="currentBetAmount" class="bet-input" value="100">
            </div>

            <div id="activeBetNotice" style="font-size: 11px; font-weight: bold; color: #fbbf24; text-align: center;"></div>
        </div>

    </div>

    <script>
        let savedBalance = localStorage.getItem('userBalance') || localStorage.getItem('balance');
        let currentBalance = (savedBalance !== null && !isNaN(parseFloat(savedBalance))) ? parseFloat(savedBalance) : 10000.00;

        let selectedBetChoice = null;
        let activeBetAmount = 0;
        let isBetLocked = false;
        const ROUND_TIME = 30;

        window.onload = function() {
            updateWalletUI();
            buildNumberGrid();
            startParityGameLoop();
        };

        function updateWalletUI() {
            if (isNaN(currentBalance)) currentBalance = 10000.00;
            document.getElementById('walletDisplay').innerText = `₹ ${currentBalance.toFixed(2)}`;
            
            localStorage.setItem('userBalance', currentBalance.toString());
            localStorage.setItem('balance', currentBalance.toString());

            updateServerBalance(currentBalance);
        }

        async function updateServerBalance(newBalance) {
            try {
                await fetch('/api/update-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ balance: newBalance })
                });
            } catch (err) {
                console.error("Failed to sync balance to server:", err);
            }
        }

        function selectChip(val, element) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('currentBetAmount').value = val;
        }

        function buildNumberGrid() {
            let grid = document.getElementById('numberGrid');
            grid.innerHTML = '';
            for(let i=0; i<=9; i++) {
                let btn = document.createElement('button');
                btn.className = 'num-parity-btn';
                btn.innerText = i;
                btn.onclick = () => placeBet(i.toString());
                grid.appendChild(btn);
            }
        }

        function placeBet(choice) {
            let nowSec = Math.floor(Date.now() / 1000) % ROUND_TIME;
            if (nowSec >= 24) {
                alert("Bets are locked for the current round! Please wait for the next round.");
                return;
            }

            let betAmt = parseFloat(document.getElementById('currentBetAmount').value);
            if (isNaN(betAmt) || betAmt <= 0) {
                alert("Please enter a valid bet amount!");
                return;
            }
            if (currentBalance < betAmt) {
                alert("Insufficient balance!");
                return;
            }

            currentBalance -= betAmt;
            activeBetAmount = betAmt;
            selectedBetChoice = choice;
            isBetLocked = true;

            updateWalletUI();
            document.getElementById('activeBetNotice').innerText = `Bet Placed: ₹${betAmt} on [${choice.toUpperCase()}]`;
            document.getElementById('resultBanner').style.display = 'none';
        }

        function startParityGameLoop() {
            setInterval(() => {
                let timestamp = Math.floor(Date.now() / 1000);
                let roundSec = timestamp % ROUND_TIME;
                let timeLeft = ROUND_TIME - roundSec;

                let periodId = Math.floor(timestamp / ROUND_TIME);
                document.getElementById('periodNumber').innerText = periodId;
                document.getElementById('timerDisplay').innerText = `${timeLeft}s`;

                if (roundSec === 0) {
                    resolveRound(periodId);
                }
            }, 1000);
        }

        function resolveRound(periodId) {
            let winningNum = Math.floor(Math.random() * 10);
            let winningColor = '';
            
            if (winningNum === 0) winningColor = 'violet';
            else if ([1, 3, 7, 9].includes(winningNum)) winningColor = 'green';
            else if ([2, 4, 6, 8].includes(winningNum)) winningColor = 'red';
            else if (winningNum === 5) winningColor = 'green';

            let payout = 0;
            let netProfit = 0;

            if (isBetLocked) {
                if (selectedBetChoice === winningNum.toString() || selectedBetChoice === winningColor) {
                    let multiplier = (selectedBetChoice === winningColor) ? (winningColor === 'violet' ? 4.5 : 2.0) : 9.0;
                    payout = activeBetAmount * multiplier;
                    netProfit = payout - activeBetAmount;
                    currentBalance += payout;
                } else {
                    netProfit = -activeBetAmount;
                }

                updateWalletUI();

                let resBanner = document.getElementById('resultBanner');
                document.getElementById('resultTitle').innerText = `RESULT: ${winningNum} (${winningColor.toUpperCase()})`;
                
                if (payout > 0) {
                    document.getElementById('resultDesc').innerHTML = `Won: <span class="profit-text">+₹${netProfit.toFixed(2)}</span>`;
                } else {
                    document.getElementById('resultDesc').innerHTML = `Loss: <span class="loss-text">-₹${activeBetAmount.toFixed(2)}</span>`;
                }
                resBanner.style.display = 'block';

                isBetLocked = false;
                selectedBetChoice = null;
                activeBetAmount = 0;
                document.getElementById('activeBetNotice').innerText = '';
            }
        }
    </script>
</body>
</html>
